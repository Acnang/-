<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이론 뽑기 🎲 랜덤 사회과학 이론</title>
<meta name="description" content="깨진 유리창 이론부터 넛지, 피그말리온 효과까지. 버튼 하나로 랜덤 이론 뽑기!">
<style>
:root{
  --bg1:#0f1226; --bg2:#1b1f45; --card:#ffffff10; --line:#ffffff22;
  --text:#f2f4ff; --sub:#aab0d6; --accent:#ffd166;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  color:var(--text);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  overflow-x:hidden;
}
/* 떠다니는 배경 */
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0;animation:float 14s ease-in-out infinite}
.orb.a{width:340px;height:340px;background:#6c63ff;top:-80px;left:-80px}
.orb.b{width:300px;height:300px;background:#ff6b9d;bottom:-60px;right:-60px;animation-delay:-5s}
.orb.c{width:240px;height:240px;background:#2ec4b6;top:45%;left:55%;animation-delay:-9s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-50px) scale(1.15)}}

main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:28px 18px 60px}
h1{text-align:center;font-size:clamp(26px,6vw,38px);margin:8px 0 4px;letter-spacing:-.5px}
.tag{text-align:center;color:var(--sub);margin:0 0 22px;font-size:14px}

.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
.chip{
  border:1px solid var(--line);background:var(--card);color:var(--text);
  padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit
}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:var(--accent);color:#2a2200;border-color:var(--accent);font-weight:700}

.stage{perspective:1200px;position:relative}
.card{
  position:relative;min-height:360px;border-radius:24px;padding:28px 24px;
  background:linear-gradient(145deg,#ffffff18,#ffffff08);
  border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 20px 60px #0006;
  display:flex;flex-direction:column;justify-content:center;
}
.card.idle .placeholder{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.placeholder{text-align:center}
.placeholder .big{font-size:76px;line-height:1}
.placeholder p{color:var(--sub);margin:14px 0 0}

.card.spinning{animation:shake .12s linear infinite}
@keyframes shake{
  0%{transform:rotate(-1deg) translateX(-3px)}
  50%{transform:rotate(1deg) translateX(3px)}
  100%{transform:rotate(-1deg) translateX(-3px)}
}
.card.spinning .slot{filter:blur(1.2px)}

.card.reveal{animation:flipIn .7s cubic-bezier(.2,.8,.2,1)}
@keyframes flipIn{
  0%{transform:rotateY(90deg) scale(.9);opacity:.2}
  100%{transform:rotateY(0) scale(1);opacity:1}
}
.result{animation:rise .6s .15s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.cat{display:inline-block;font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;color:#10122a}
.slot{font-size:clamp(26px,6.5vw,38px);font-weight:800;margin:14px 0 2px;letter-spacing:-.5px;word-break:keep-all}
.en{color:var(--sub);font-size:14px;margin-bottom:6px}
.who{color:var(--accent);font-size:13px;margin-bottom:16px}
.box{background:#00000030;border-radius:14px;padding:14px 16px;margin-top:10px;font-size:15px;line-height:1.65;word-break:keep-all}
.box b{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;letter-spacing:.5px}
.box{position:relative}
.box .txt{transition:filter .3s}
.box.mosaic{cursor:pointer}
.box.mosaic .txt{filter:blur(9px);user-select:none;-webkit-user-select:none}
.box.mosaic::after{
  content:'👆 눌러서 보기';position:absolute;left:0;right:0;top:55%;transform:translateY(-50%);
  text-align:center;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 8px #000
}

.actions{display:flex;gap:10px;margin-top:22px}
.btn{
  flex:1;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:800;cursor:pointer;
  font-family:inherit;transition:.15s
}
.btn.main{background:linear-gradient(135deg,#ffd166,#ff9f6b);color:#2a1a00;box-shadow:0 8px 24px #ff9f6b55}
.btn.main:hover{transform:translateY(-3px) scale(1.02)}
.btn.main:active{transform:scale(.97)}
.btn.main:disabled{opacity:.6;cursor:wait;transform:none}
.btn.sub{flex:0 0 auto;background:var(--card);color:var(--text);border:1px solid var(--line);font-size:15px;padding:16px 18px}
.btn.sub:hover{background:#ffffff22}

.hist{margin-top:30px}
.hist h2{font-size:14px;color:var(--sub);font-weight:600;margin:0 0 10px}
.hist .list{display:flex;flex-wrap:wrap;gap:8px}
.hist .chip{font-size:12px}
.hint{text-align:center;color:var(--sub);font-size:12px;margin-top:26px}

.spark{
  position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:5;
  animation:burst .9s ease-out forwards
}
@keyframes burst{
  to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}
}
.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
  background:#000c;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;
  opacity:0;transition:.3s;z-index:10;pointer-events:none
}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important}
}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>

<main>
  <h1>🎲 이론 뽑기</h1>
  <p class="tag">깨진 유리창 이론부터 넛지까지 · <span id="count"></span>개 이론 중 하나를 랜덤으로!</p>

  <div class="chips" id="chips"></div>

  <div class="stage">
    <div class="card idle" id="card">
      <div class="placeholder">
        <div class="big">🔮</div>
        <p>아래 버튼을 눌러 오늘의 이론을 뽑아보세요</p>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn main" id="draw">이론 뽑기!</button>
    <button class="btn sub" id="mask" title="설명·예시 가리기 (퀴즈 모드)">🙈 가리기</button>
    <button class="btn sub" id="copy" title="결과 복사">📋 복사</button>
  </div>

  <div class="hist" id="histWrap" hidden>
    <h2>최근 뽑은 이론 (눌러서 다시 보기)</h2>
    <div class="list" id="hist"></div>
  </div>

  <p class="hint">스페이스바 / 엔터로도 뽑을 수 있어요</p>
</main>

<div class="toast" id="toast"></div>

<script>

   c: 분류 / n: 이름 / e: 영문명 / w: 제안자·연도 / s: 한 줄 설명 / x: 예시 */
const THEORIES = [
  /* ---- 사회·범죄 ---- */
  {c:'사회·범죄',n:'깨진 유리창 이론',e:'Broken Windows Theory',w:'제임스 Q. 윌슨 · 조지 켈링 (1982)',

   x:'낙서와 쓰레기를 방치한 골목이 점점 더 지저분해지고 범죄가 늘어나는 경우. (효과에 대한 논쟁도 많아요)'},

   x:'한 번 비행으로 꼬리표가 붙은 학생이 주변의 시선 때문에 오히려 문제 행동을 이어가는 경우.'},
  {c:'사회·범죄',n:'아노미 이론',e:'Anomie Theory',w:'에밀 뒤르켐 · 로버트 머튼',
   s:'사회가 제시하는 목표(성공)와 이를 이룰 합법적 수단 사이에 괴리가 생기면 일탈이 늘어난다는 이론.',

  {c:'사회·범죄',n:'사회유대(통제) 이론',e:'Social Bond Theory',w:'트래비스 허쉬 (1969)',
   s:'애착·참여·신념 등 사회와의 유대가 강하면 일탈하지 않고, 약해지면 일탈한다는 이론.',
   x:'가족·학교·동아리와의 유대가 끈끈한 학생일수록 비행 가능성이 낮아지는 경우.'},
  {c:'사회·범죄',n:'일상활동 이론',e:'Routine Activity Theory',w:'로런스 코언 · 마커스 펠슨 (1979)',

   x:'CCTV와 가로등이 없는 야간 골목에서 범죄가 잘 발생하는 경우.'},
  {c:'사회·범죄',n:'사회자본론',e:'Social Capital',w:'로버트 퍼트넘 (『나 홀로 볼링』, 2000)',
   s:'신뢰·규범·네트워크 같은 사회적 관계가 공동체와 민주주의의 성과를 높인다는 이론.',
   x:'이웃 간 신뢰가 높은 동네일수록 방범, 돌봄, 지역 활동이 활발한 경우.'},
  {c:'사회·범죄',n:'유리천장',e:'Glass Ceiling',w:'1980년대 미국에서 대중화된 개념',
   s:'능력이 있어도 성별·인종 등을 이유로 조직의 상층부로 올라가지 못하게 막는 보이지 않는 장벽.',
   x:'여성 직원 비율은 높은데 임원·관리직 비율은 현저히 낮은 기업.'},
  {c:'사회·범죄',n:'상징적 상호작용론',e:'Symbolic Interactionism',w:'조지 허버트 미드 · 허버트 블루머',
   s:'사람들이 언어·몸짓 같은 상징을 주고받으며 의미를 만들고, 이를 바탕으로 사회가 형성된다는 관점.',
   x:'같은 “엄지척” 이모지가 문화권에 따라 칭찬이 되기도 조롱이 되기도 하는 경우.'},

   x:'담배가 해롭다는 걸 알면서 피우는 사람이 “나는 괜찮을 거야”라고 합리화하는 경우.'},
  {c:'심리',n:'피그말리온 효과',e:'Pygmalion Effect',w:'로버트 로젠탈 · 레노어 제이콥슨 (1968)',

   x:'사람이 많은 길에서 쓰러진 사람을 모두가 서로 눈치만 보며 지나치는 경우.'},
  {c:'심리',n:'매슬로의 욕구 위계 이론',e:"Maslow's Hierarchy of Needs",w:'에이브러햄 매슬로 (1943)',

  {c:'경제',n:'넛지 이론',e:'Nudge Theory',w:'리처드 탈러 · 캐스 선스타인 (2008)',

/* ================================================================= */

const COLORS = {'사회·범죄':'#ff8fa3','심리':'#b794f6','경제':'#ffd166','정치·국제':'#6ee7b7','조직·경영':'#7dd3fc'};
const $ = id => document.getElementById(id);
const card = $('card'), drawBtn = $('draw');
let current = null, busy = false, filter = '전체', history = [], hideMode = false;

$('count').textContent = THEORIES.length;

/* 분류 칩 */
const cats = ['전체', ...new Set(THEORIES.map(t => t.c))];
cats.forEach(c => {
  const b = document.createElement('button');
  b.className = 'chip' + (c === filter ? ' on' : '');
  b.textContent = c === '전체' ? `전체 (${THEORIES.length})` : `${c} (${THEORIES.filter(t=>t.c===c).length})`;
  b.onclick = () => {
    filter = c;
    document.querySelectorAll('#chips .chip').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  };
  $('chips').appendChild(b);
});

/* 카드 렌더 */
function render(t, spinning){
  card.className = 'card' + (spinning ? ' spinning' : '');
  card.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = spinning ? '' : 'result';

  const cat = document.createElement('span');
  cat.className = 'cat'; cat.textContent = t.c; cat.style.background = COLORS[t.c] || '#fff';
  const name = document.createElement('div'); name.className = 'slot'; name.textContent = t.n;
  wrap.append(cat, name);

  if(!spinning){
    const en = document.createElement('div'); en.className = 'en'; en.textContent = t.e;
    const who = document.createElement('div'); who.className = 'who'; who.textContent = '👤 ' + t.w;
    const mk = (label, text) => {
      const d = document.createElement('div');
      d.className = 'box' + (hideMode ? ' mosaic' : '');
      const b = document.createElement('b'); b.textContent = label;
      const sp = document.createElement('span'); sp.className = 'txt'; sp.textContent = text;
      d.append(b, sp);
      d.addEventListener('click', () => d.classList.remove('mosaic'));
      return d;
    };
    wrap.append(en, who, mk('📖 한 줄 설명', t.s), mk('💡 예시', t.x));
  }
  card.appendChild(wrap);
}

/* 반짝이 효과 */
function sparkle(){
  const r = card.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const cols = ['#ffd166','#ff6b9d','#6ee7b7','#7dd3fc','#b794f6'];
  for(let i=0;i<28;i++){
    const p = document.createElement('span');
    p.className = 'spark';
    const a = Math.random()*Math.PI*2, d = 90 + Math.random()*170;
    p.style.left = cx+'px'; p.style.top = cy+'px';
    p.style.background = cols[i % cols.length];
    p.style.setProperty('--dx', Math.cos(a)*d+'px');
    p.style.setProperty('--dy', Math.sin(a)*d+'px');
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 950);
  }
}

function reveal(t){
  current = t;
  render(t, false);
  card.classList.add('reveal');
  sparkle();
  history = [t, ...history.filter(h => h !== t)].slice(0, 10);
  renderHistory();
}

function renderHistory(){
  $('histWrap').hidden = history.length === 0;
  const box = $('hist'); box.innerHTML = '';
  history.forEach(t => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = t.n;
    b.onclick = () => { if(busy) return; current = t; render(t,false); card.classList.add('reveal'); };
    box.appendChild(b);
  });
}

/* 뽑기 (슬롯머신처럼 점점 느려지며 멈춤) */
function draw(){
  if(busy) return;
  const pool = THEORIES.filter(t => filter === '전체' || t.c === filter);
  let pick;
  do { pick = pool[Math.floor(Math.random()*pool.length)]; }
  while(pool.length > 1 && pick === current);

  busy = true; drawBtn.disabled = true; drawBtn.textContent = '뽑는 중…';
  const steps = 20; let i = 0;
  (function tick(){
    if(i < steps){
      render(pool[Math.floor(Math.random()*pool.length)], true);
      i++;
      setTimeout(tick, 45 + i*i*0.5);
    } else {
      reveal(pick);
      busy = false; drawBtn.disabled = false; drawBtn.textContent = '다시 뽑기!';
    }
  })();
}

drawBtn.onclick = draw;

$('mask').onclick = () => {
  hideMode = !hideMode;
  document.querySelectorAll('#card .box').forEach(b => b.classList.toggle('mosaic', hideMode));
  $('mask').textContent = hideMode ? '👀 보이기' : '🙈 가리기';
};

$('copy').onclick = () => {
  if(!current){ toast('먼저 이론을 뽑아주세요!'); return; }
  const t = current;
  const text = `[${t.c}] ${t.n} (${t.e})\n${t.w}\n\n${t.s}\n예시: ${t.x}`;
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .then(() => toast('복사했어요 ✅'))
    .catch(() => toast('복사에 실패했어요'));
};

function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove('show'), 1600);
}

document.addEventListener('keydown', e => {
  if(e.code === 'Space' || e.code === 'Enter'){
    if(e.target.tagName === 'BUTTON') return;
    e.preventDefault(); draw();
  }
});
</script>
